<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feel Me Dance — Запись</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-base: #252322;
    --bg-card: #302E2C;
    --border-soft: rgba(255,255,255,0.08);
    --text-primary: #F5F3F0;
    --text-secondary: #9C948C;
    --accent-pink: #D4527E;
    --accent-pink-active: #E85D8C;
    --accent-danger: #C0546A;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background-color: var(--bg-base);
    background-image: url('pattern.png');
    background-repeat: no-repeat;
    background-position: top center;
    background-size: cover;
    background-attachment: fixed;
    color: var(--text-primary);
  }
  .app-shell {
    max-width: 480px;
    margin: 0 auto;
    padding: 0 16px 24px;
  }
  .app-header {
    background: url('logo.png') center / contain no-repeat;
    aspect-ratio: 600 / 300;
    width: 100%;
    max-width: 320px;
    margin: 16px auto 20px;
  }
  h1 {
    font-size: 20px;
    font-weight: 300;
    letter-spacing: 0.02em;
    margin: 0 0 16px;
  }
  .status-card {
    background: var(--bg-card);
    border: 1px solid var(--border-soft);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 20px;
  }
  .status-card p { margin: 0 0 4px; color: var(--text-secondary); }
  .status-card .title { font-weight: 500; margin-bottom: 8px; color: var(--text-primary); }
  .class-list { display: flex; flex-direction: column; gap: 10px; }
  .class-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--bg-card);
    border: 1px solid var(--border-soft);
    border-radius: 14px;
    padding: 14px 16px;
  }
  .class-item .info { display: flex; flex-direction: column; }
  .class-item .day-time { font-weight: 500; }
  .class-item .type { font-size: 14px; color: var(--text-secondary); }
  .class-item .spots { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
  button.book-btn, button.cancel-btn {
    border: none;
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
  }
  button.book-btn {
    background: transparent;
    border: 1px solid var(--text-secondary);
    color: var(--text-primary);
    transition: background .15s ease, border-color .15s ease;
  }
  button.book-btn:active, button.book-btn:hover {
    background: var(--accent-pink-active);
    border-color: var(--accent-pink-active);
    color: #fff;
  }
  button.book-btn:disabled { opacity: 0.4; cursor: default; }
  button.book-btn.booked {
    background: var(--accent-pink);
    border-color: var(--accent-pink);
    color: #fff;
    opacity: 1;
  }
  button.cancel-btn { background: var(--accent-danger); color: #fff; }
  .empty { color: var(--text-secondary); text-align: center; margin-top: 40px; }
</style>
</head>
<body>

<div class="app-shell">
  <div class="app-header"></div>

  <h1>Запись на занятия</h1>

  <div id="myBookingBlock" class="status-card" style="display:none;"></div>

  <div id="classList" class="class-list"></div>
  <div id="loading" class="empty">Загрузка...</div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const initData = tg.initData || '';

let schedule = [];
let myBooking = null;

async function loadData() {
  const [scheduleRes, bookingRes] = await Promise.all([
    fetch('/api/schedule').then(r => r.json()),
    fetch('/api/mybooking?initData=' + encodeURIComponent(initData)).then(r => r.json())
  ]);
  schedule = scheduleRes;
  myBooking = bookingRes.booking;
  render();
}

function render() {
  document.getElementById('loading').style.display = 'none';

  const bookingBlock = document.getElementById('myBookingBlock');
  if (myBooking) {
    bookingBlock.style.display = 'block';
    bookingBlock.innerHTML = `
      <div class="title">Твоя запись</div>
      <p>${myBooking.day} ${myBooking.time} — ${myBooking.className}</p>
      <button class="cancel-btn" onclick="cancelBooking()">Отменить запись</button>
    `;
  } else {
    bookingBlock.style.display = 'none';
  }

  const list = document.getElementById('classList');
  list.innerHTML = '';
  schedule.forEach(s => {
    const item = document.createElement('div');
    item.className = 'class-item';
    const alreadyBookedThis = myBooking && myBooking.classId === s.id;
    item.innerHTML = `
      <div class="info">
        <div class="day-time">${s.day} ${s.time}</div>
        <div class="type">${s.type}</div>
        <div class="spots">${s.spots} мест</div>
      </div>
      <button class="book-btn ${alreadyBookedThis ? 'booked' : ''}" ${myBooking ? 'disabled' : ''} onclick="book('${s.id}')">
        ${alreadyBookedThis ? 'Записан' : 'Записаться'}
      </button>
    `;
    list.appendChild(item);
  });
}

async function book(classId) {
  const res = await fetch('/api/book', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ initData, classId })
  });
  const data = await res.json();
  if (data.ok) {
    tg.HapticFeedback.notificationOccurred('success');
    myBooking = { ...data.booking, classId };
    render();
  } else if (data.error === 'already_booked') {
    tg.showAlert('Ты уже записан(а) на занятие.');
  } else {
    tg.showAlert('Не удалось записаться. Попробуй позже.');
  }
}

async function cancelBooking() {
  const res = await fetch('/api/cancel', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ initData })
  });
  const data = await res.json();
  if (data.ok) {
    tg.HapticFeedback.notificationOccurred('success');
    myBooking = null;
    render();
  }
}

loadData();
</script>

</body>
</html>
