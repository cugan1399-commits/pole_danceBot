<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feel Me Dance — Запись</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-base: #252322;
    --bg-card: #302E2C;
    --border-soft: rgba(255,255,255,0.08);
    --text-primary: #F5F3F0;
    --text-secondary: #9C948C;
    --accent-pink: #D4527E;
    --accent-pink-active: #E85D8C;
    --accent-danger: #C0546A;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background-color: var(--bg-base);
    background-image: url('pattern.png');
    background-repeat: no-repeat;
    background-position: top center;
    background-size: cover;
    background-attachment: fixed;
    color: var(--text-primary);
  }
  .app-shell {
    max-width: 480px;
    margin: 0 auto;
    padding: 0 16px 24px;
  }
  .app-header {
    background: url('logo.png') center / cover no-repeat;
    aspect-ratio: 600 / 300;
    width: 100%;
    margin: 0 0 20px;
  }
  h1 {
    font-size: 20px;
    font-weight: 300;
    letter-spacing: 0.02em;
    margin: 0 0 16px;
  }
  .status-card {
    background: var(--bg-card);
    border: 1px solid var(--border-soft);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 20px;
  }
  .status-card p { margin: 0 0 4px; color: var(--text-secondary); }
  .status-card .title { font-weight: 500; margin-bottom: 8px; color: var(--text-primary); }
  .class-list { display: flex; flex-direction: column; gap: 10px; }
  .class-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--bg-card);
    border: 1px solid var(--border-soft);
    border-radius: 14px;
    padding: 14px 16px;
  }
  .class-item .info { display: flex; flex-direction: column; }
  .class-item .day-time { font-weight: 500; }
  .class-item .type { font-size: 14px; color: var(--text-secondary); }
  .class-item .spots { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
  button.book-btn, button.cancel-btn {
    border: none;
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
  }
  button.book-btn {
    background: transparent;
    border: 1px solid var(--text-secondary);
    color: var(--text-primary);
    transition: background .15s ease, border-color .15s ease;
  }
  button.book-btn:active, button.book-btn:hover {
    background: var(--accent-pink-active);
    border-color: var(--accent-pink-active);
    color: #fff;
  }
  button.book-btn:disabled { opacity: 0.4; cursor: default; }
  button.book-btn.booked {
    background: var(--accent-pink);
    border-color: var(--accent-pink);
    color: #fff;
    opacity: 1;
  }
  button.cancel-btn { background: var(--accent-danger); color: #fff; }
  .empty { color: var(--text-secondary); text-align: center; margin-top: 40px; }

  .tabbar { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 16px; padding-bottom: 4px; }
  .tab-btn {
    flex: 0 0 auto;
    background: transparent;
    border: 1px solid var(--border-soft);
    color: var(--text-secondary);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
  }
  .tab-btn.active { background: var(--accent-pink); border-color: var(--accent-pink); color: #fff; }

  .admin-form { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
  .admin-form input {
    background: var(--bg-card);
    border: 1px solid var(--border-soft);
    color: var(--text-primary);
    border-radius: 8px;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 14px;
  }
  .primary-btn {
    background: var(--accent-pink);
    border: none;
    color: #fff;
    border-radius: 8px;
    padding: 10px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
  }

  .wizard-step-label { color: var(--text-secondary); font-size: 13px; margin: 0 0 10px; }
  .wizard-options { display: flex; flex-wrap: wrap; gap: 8px; }
  .wizard-opt {
    background: var(--bg-card);
    border: 1px solid var(--border-soft);
    color: var(--text-primary);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
  }
  .wizard-opt:disabled { opacity: 0.3; cursor: not-allowed; }
  .wizard-back { margin-bottom: 12px; background: transparent; border: none; color: var(--text-secondary); font-size: 13px; font-family: inherit; cursor: pointer; padding: 0; }

  .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .cal-header span { font-weight: 500; }
  .cal-header button {
    background: transparent;
    border: 1px solid var(--border-soft);
    color: var(--text-primary);
    border-radius: 8px;
    width: 36px;
    height: 36px;
    font-size: 18px;
    cursor: pointer;
  }
  .cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; color: var(--text-secondary); font-size: 12px; margin-bottom: 6px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; touch-action: pan-y; }
  .cal-cell {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    background: var(--bg-card);
  }
  .cal-cell.other-month { opacity: 0.25; cursor: default; }
  .cal-cell.today { border: 1px solid var(--accent-pink); }
  .cal-cell.selected { background: var(--accent-pink); color: #fff; }
  .cal-agenda-item {
    background: var(--bg-card);
    border: 1px solid var(--border-soft);
    border-radius: 10px;
    padding: 10px 12px;
    margin-top: 8px;
    font-size: 13px;
  }

  /* ---- Анкета-заявка ---- */
  .avail-day-block { margin-bottom: 14px; }
  .avail-day-label { font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; }
  .avail-hours { display: flex; flex-wrap: wrap; gap: 6px; }
  .avail-chip {
    background: var(--bg-card);
    border: 1px solid var(--border-soft);
    color: var(--text-primary);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
  }
  .avail-chip.picked { background: var(--accent-pink); border-color: var(--accent-pink); color: #fff; }
  .wizard-opt.active-day { background: var(--accent-pink); border-color: var(--accent-pink); color: #fff; }
  .wizard-opt.day-has-picks { border-color: var(--accent-pink); color: var(--accent-pink); }
  .form-field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
  .form-field label { font-size: 12px; color: var(--text-secondary); }
  .status-pending { border-left: 3px solid var(--accent-pink); }
  .app-summary-line { font-size: 13px; color: var(--text-secondary); margin: 2px 0; }
  .agenda-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 8px 0; border-bottom: 1px solid var(--border-soft); }
  .agenda-time { font-size: 13px; color: var(--text-secondary); min-width: 42px; }
</style>
</head>
<body>

<div class="app-header"></div>

<div class="app-shell">
  <div class="tabbar" id="tabbar">
    <button class="tab-btn active" data-tab="schedule" onclick="switchTab('schedule')">Запись</button>
    <button class="tab-btn" data-tab="myschedule" onclick="switchTab('myschedule')">Моё расписание</button>
  </div>

  <div id="tab-schedule" class="tab-panel">
    <h1>Запись на занятия</h1>
    <div id="applyRoot"></div>
  </div>

  <div id="tab-myschedule" class="tab-panel" style="display:none">
    <h1>Моё расписание</h1>
    <div id="myScheduleList" class="class-list"></div>
  </div>

  <div id="tab-applications" class="tab-panel" style="display:none">
    <h1>Заявки</h1>
    <div id="applicationsList" class="class-list"></div>
    <div id="assignPanel"></div>
  </div>

  <div id="tab-trainers" class="tab-panel" style="display:none">
    <h1>Тренеры</h1>
    <div id="trainersList" class="class-list"></div>
    <div class="admin-form">
      <input id="trainerIdInput" placeholder="Telegram ID тренера">
      <input id="trainerNameInput" placeholder="Имя тренера">
      <button class="primary-btn" onclick="addTrainer()">Добавить тренера</button>
    </div>
  </div>

  <div id="tab-directions" class="tab-panel" style="display:none">
    <h1>Направления</h1>
    <div id="directionsList" class="class-list"></div>
    <div class="admin-form">
      <input id="directionNameInput" placeholder="Название направления">
      <button class="primary-btn" onclick="addDirection()">Добавить</button>
    </div>
  </div>

  <div id="tab-classes" class="tab-panel" style="display:none">
    <h1>Добавить занятие</h1>
    <div id="classWizard"></div>
  </div>

  <div id="tab-calendar" class="tab-panel" style="display:none">
    <h1>Календарь</h1>
    <div class="cal-header">
      <button onclick="calPrevMonth()">‹</button>
      <span id="calMonthLabel"></span>
      <button onclick="calNextMonth()">›</button>
    </div>
    <div class="cal-weekdays"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span></div>
    <div class="cal-grid" id="calGrid"></div>
    <div id="calAgenda"></div>
  </div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const initData = tg.initData || '';

const APP_WEEKDAYS = [
  ['mon', 'Понедельник'], ['tue', 'Вторник'], ['wed', 'Среда'],
  ['thu', 'Четверг'], ['fri', 'Пятница'], ['sat', 'Суббота'], ['sun', 'Воскресенье'],
];
const APP_HOURS = [];
for (let h = 9; h <= 20; h++) APP_HOURS.push(String(h).padStart(2, '0') + ':00');
const APP_GROUPS = ['Новичок', 'Standard', 'Pro'];

function appDayLabel(key) {
  const found = APP_WEEKDAYS.find(([k]) => k === key);
  return found ? found[1] : key;
}

// ---------- "Запись" (анкета-заявка) ----------
let applyState = { step: 'loading', direction: null, trainerId: null, trainerName: null, group: null, availability: [] };
let directionsCache = [];
let trainersCache = [];

async function initApplyTab() {
  const [myApps, mySchedule] = await Promise.all([
    fetch('/api/myapplications?initData=' + encodeURIComponent(initData)).then(r => r.json()),
    fetch('/api/myschedule?initData=' + encodeURIComponent(initData)).then(r => r.json()),
  ]);
  const pending = myApps.find(a => a.status === 'pending');

  if (pending) {
    renderApplyStatus(pending, mySchedule.length);
    return;
  }
  applyState = { step: 'direction', direction: null, trainerId: null, trainerName: null, group: null, availability: [] };
  renderApplyWizard();
}

function renderApplyStatus(pending, hasConfirmed) {
  const root = document.getElementById('applyRoot');
  root.innerHTML = `
    <div class="status-card status-pending">
      <div class="title">Заявка на рассмотрении</div>
      <p class="app-summary-line">Направление: ${pending.direction}</p>
      <p class="app-summary-line">Группа: ${pending.group}</p>
      <p class="app-summary-line">Тренер: ${pending.trainerName || 'ещё не выбран — решит админ'}</p>
      <p style="margin-top:10px;color:var(--text-secondary)">Тренер свяжется и подтвердит время. Как только вас запишут — придёт сообщение, а занятие появится во вкладке «Моё расписание».</p>
    </div>
    ${hasConfirmed ? '' : ''}
    <button class="primary-btn" style="margin-top:8px" onclick="switchTab('myschedule')">Моё расписание</button>
  `;
}

function renderApplyWizard() {
  const root = document.getElementById('applyRoot');

  if (applyState.step === 'direction') {
    root.innerHTML = '<div class="wizard-step-label">Выберите направление</div><div class="wizard-options">' +
      (directionsCache.length ? directionsCache : ['Pole Dance', 'Exotic', 'Stretching'])
        .map(d => `<button class="wizard-opt" onclick="applyPickDirection('${d.replace(/'/g, "\\'")}')">${d}</button>`).join('') +
      '</div>';
    return;
  }

  if (applyState.step === 'trainer') {
    const options = trainersCache.map(t =>
      `<button class="wizard-opt" onclick="applyPickTrainer(${t.telegramId}, '${t.name.replace(/'/g, "\\'")}')">${t.name}</button>`
    ).join('');
    root.innerHTML = '<button class="wizard-back" onclick="applyBack()">← назад</button>' +
      `<div class="wizard-step-label">${applyState.direction} — выберите тренера</div><div class="wizard-options">` +
      options +
      `<button class="wizard-opt" onclick="applyPickTrainer(null, null)">Не знаю тренера</button>` +
      '</div>';
    return;
  }

  if (applyState.step === 'group') {
    root.innerHTML = '<button class="wizard-back" onclick="applyBack()">← назад</button>' +
      '<div class="wizard-step-label">Выберите группу</div><div class="wizard-options">' +
      APP_GROUPS.map(g => `<button class="wizard-opt" onclick="applyPickGroup('${g}')">${g}</button>`).join('') +
      '</div>';
    return;
  }

  if (applyState.step === 'availability') {
    if (!applyState.activeDay) applyState.activeDay = APP_WEEKDAYS[0][0];
    let html = '<button class="wizard-back" onclick="applyBack()">← назад</button>';
    html += '<div class="wizard-step-label">Выберите день, потом время — можно отметить несколько дней</div>';
    html += '<div class="wizard-options" style="margin-bottom:14px">';
    APP_WEEKDAYS.forEach(([key, label]) => {
      const hasPicks = applyState.availability.some(a => a.day === key);
      const active = applyState.activeDay === key;
      html += `<button class="wizard-opt ${active ? 'active-day' : ''} ${hasPicks && !active ? 'day-has-picks' : ''}" onclick="applySelectDay('${key}')">${label}${hasPicks ? ' •' : ''}</button>`;
    });
    html += '</div>';
    html += `<div class="avail-day-block"><div class="avail-day-label">${appDayLabel(applyState.activeDay)}</div><div class="avail-hours">`;
    APP_HOURS.forEach(h => {
      const picked = applyState.availability.some(a => a.day === applyState.activeDay && a.time === h);
      html += `<button class="avail-chip ${picked ? 'picked' : ''}" onclick="applyToggleSlot('${applyState.activeDay}','${h}')">${h}</button>`;
    });
    html += '</div></div>';
    html += `<button class="primary-btn" style="width:100%;margin-top:14px" onclick="applyGoToContacts()">Далее</button>`;
    root.innerHTML = html;
    return;
  }

  if (applyState.step === 'contacts') {
    const tgUser = tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user : {};
    const defaultName = [tgUser.first_name, tgUser.last_name].filter(Boolean).join(' ');
    const canEditUsername = isAdmin || isTrainer;
    root.innerHTML = `
      <button class="wizard-back" onclick="applyBack()">← назад</button>
      <div class="wizard-step-label">Контактная информация</div>
      <div class="form-field">
        <label>Имя</label>
        <input id="applyName" placeholder="Ваше имя" value="${defaultName}">
      </div>
      <div class="form-field">
        <label>Ник в Telegram${canEditUsername ? ' (можно изменить, если оформляете за участника)' : ''}</label>
        <input id="applyUsername" value="${tgUser.username ? '@' + tgUser.username : ''}" ${canEditUsername ? '' : 'disabled'}>
      </div>
      <div class="form-field">
        <label>Номер телефона</label>
        <input id="applyPhone" placeholder="+375 29 000-00-00">
      </div>
      <button class="primary-btn" style="width:100%;margin-top:8px" onclick="submitApplication()">Отправить</button>
    `;
    return;
  }
}

function applyBack() {
  const order = ['direction', 'trainer', 'group', 'availability', 'contacts'];
  const idx = order.indexOf(applyState.step);
  if (idx > 0) applyState.step = order[idx - 1];
  renderApplyWizard();
}

async function applyPickDirection(d) {
  applyState.direction = d;
  if (!trainersCache.length) {
    trainersCache = await fetch('/api/trainers').then(r => r.json());
  }
  applyState.step = 'trainer';
  renderApplyWizard();
}

function applyPickTrainer(id, name) {
  applyState.trainerId = id;
  applyState.trainerName = name;
  applyState.step = 'group';
  renderApplyWizard();
}

function applyPickGroup(g) {
  applyState.group = g;
  applyState.step = 'availability';
  renderApplyWizard();
}

function applySelectDay(day) {
  applyState.activeDay = day;
  renderApplyWizard();
}

function applyToggleSlot(day, time) {
  const idx = applyState.availability.findIndex(a => a.day === day && a.time === time);
  if (idx >= 0) applyState.availability.splice(idx, 1);
  else applyState.availability.push({ day, time });
  renderApplyWizard();
}

function applyGoToContacts() {
  if (!applyState.availability.length) {
    tg.showAlert('Отметьте хотя бы один вариант времени.');
    return;
  }
  applyState.step = 'contacts';
  renderApplyWizard();
}

async function submitApplication() {
  const name = document.getElementById('applyName').value.trim();
  const phone = document.getElementById('applyPhone').value.trim();
  const usernameOverride = document.getElementById('applyUsername').value.trim();
  if (!name || !phone) {
    tg.showAlert('Заполните имя и телефон.');
    return;
  }

  const res = await fetch('/api/apply', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      initData,
      direction: applyState.direction,
      trainerId: applyState.trainerId,
      group: applyState.group,
      availability: applyState.availability,
      name, phone, usernameOverride,
    }),
  });
  const data = await res.json();
  if (data.ok) {
    tg.HapticFeedback.notificationOccurred('success');
    tg.showAlert('Заявка отправлена! Ждите подтверждения.');
    initApplyTab();
  } else {
    tg.showAlert('Не удалось отправить заявку. Попробуйте ещё раз.');
  }
}

// ---------- "Моё расписание" ----------
async function loadMySchedule() {
  const list = await fetch('/api/myschedule?initData=' + encodeURIComponent(initData)).then(r => r.json());
  const el = document.getElementById('myScheduleList');

  if (!list.length) {
    el.innerHTML = '<div class="empty">Пока нет подтверждённых занятий. Отправьте заявку во вкладке «Запись».</div>';
    return;
  }

  if (isTrainer) {
    // У тренера/админа на каждом занятии сразу виден список участников
    el.innerHTML = list.map(c => {
      const participants = (c.participants || []).length
        ? c.participants.map(p => `<div class="app-summary-line">• ${p.name}${p.group ? ' — ' + p.group : ''}</div>`).join('')
        : '<div class="app-summary-line">Пока никто не записан</div>';
      return `
        <div class="class-item" style="flex-direction:column;align-items:stretch">
          <div class="info">
            <div class="day-time">${c.dayLabel} ${c.time}</div>
            <div class="type">${c.direction}${c.group ? ' — ' + c.group : ''}</div>
          </div>
          <div style="margin-top:6px">${participants}</div>
        </div>
      `;
    }).join('');
    return;
  }

  el.innerHTML = list.map(c => `
    <div class="class-item">
      <div class="info">
        <div class="day-time">${c.dayLabel} ${c.time}</div>
        <div class="type">${c.direction} — тренер ${c.trainerName}</div>
      </div>
    </div>
  `).join('');
}

// ===================== Админ-режим: вкладки, тренеры, направления, занятия, календарь =====================
let isAdmin = false;
let isTrainer = false;

async function initApp() {
  directionsCache = await fetch('/api/directions').then(r => r.json());

  try {
    const me = await fetch('/api/me?initData=' + encodeURIComponent(initData)).then(r => r.json());
    isAdmin = !!me.isAdmin;
    isTrainer = !!me.isTrainer;
  } catch (e) {
    isAdmin = false;
    isTrainer = false;
  }

  await initApplyTab();
  if (isAdmin) buildAdminTabs();

  // Если тренер/админ перешёл по кнопке из уведомления о конкретной заявке — сразу открываем её
  const wantedAppId = new URLSearchParams(location.search).get('app');
  if (isAdmin && wantedAppId) {
    switchTab('applications');
  }
}

function buildAdminTabs() {
  const bar = document.getElementById('tabbar');
  const tabs = [
    { id: 'applications', label: 'Заявки' },
    { id: 'trainers', label: 'Тренеры' },
    { id: 'directions', label: 'Направления' },
    { id: 'classes', label: 'Занятия' },
    { id: 'calendar', label: 'Календарь' },
  ];
  tabs.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn';
    btn.dataset.tab = t.id;
    btn.textContent = t.label;
    btn.onclick = () => switchTab(t.id);
    bar.appendChild(btn);
  });
}

function switchTab(tabId) {
  document.querySelectorAll('.tab-panel').forEach(p => p.style.display = 'none');
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tabId));
  document.getElementById('tab-' + tabId).style.display = 'block';
  if (tabId === 'schedule') initApplyTab();
  else if (tabId === 'myschedule') loadMySchedule();
  else if (tabId === 'applications') loadApplications();
  else if (tabId === 'trainers') loadTrainers();
  else if (tabId === 'directions') loadDirections();
  else if (tabId === 'classes') startClassWizard();
  else if (tabId === 'calendar') initCalendar();
}

// ---------- Тренеры ----------
async function loadTrainers() {
  const list = await fetch('/api/admin/trainers?initData=' + encodeURIComponent(initData)).then(r => r.json());
  const el = document.getElementById('trainersList');
  el.innerHTML = list.length
    ? list.map(t => `
        <div class="class-item">
          <div class="info">
            <div class="day-time">${t.name}</div>
            <div class="type">ID: ${t.telegramId}</div>
          </div>
        </div>
      `).join('')
    : '<div class="empty" style="margin-top:0">Пока нет тренеров</div>';
}

async function addTrainer() {
  const telegramId = document.getElementById('trainerIdInput').value.trim();
  const name = document.getElementById('trainerNameInput').value.trim();
  if (!telegramId || !name) return tg.showAlert('Заполни оба поля.');

  const res = await fetch('/api/admin/trainers', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ initData, telegramId, name })
  });
  const data = await res.json();
  if (data.ok) {
    document.getElementById('trainerIdInput').value = '';
    document.getElementById('trainerNameInput').value = '';
    tg.HapticFeedback.notificationOccurred('success');
    loadTrainers();
  } else {
    tg.showAlert(data.error === 'already_exists' ? 'Тренер с таким ID уже есть.' : 'Не получилось сохранить.');
  }
}

// ---------- Направления ----------
async function loadDirections() {
  const list = await fetch('/api/directions').then(r => r.json());
  const el = document.getElementById('directionsList');
  el.innerHTML = list.length
    ? list.map(name => `
        <div class="class-item">
          <div class="info"><div class="day-time">${name}</div></div>
        </div>
      `).join('')
    : '<div class="empty" style="margin-top:0">Пока нет направлений</div>';
}

async function addDirection() {
  const name = document.getElementById('directionNameInput').value.trim();
  if (!name) return tg.showAlert('Введи название направления.');

  const res = await fetch('/api/admin/directions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ initData, name })
  });
  const data = await res.json();
  if (data.ok) {
    document.getElementById('directionNameInput').value = '';
    tg.HapticFeedback.notificationOccurred('success');
    loadDirections();
  } else {
    tg.showAlert(data.error === 'already_exists' ? 'Такое направление уже есть.' : 'Не получилось сохранить.');
  }
}

// ---------- Заявки (админ) ----------
let assignState = null;

function appConfirmedClassIds(a) {
  const ids = new Set();
  (a.confirmedClassIds || []).forEach(id => ids.add(String(id)));
  if (a.confirmedClassId) ids.add(String(a.confirmedClassId));
  return [...ids];
}

function appInfoCard(a) {
  const availabilityText = APP_WEEKDAYS
    .map(([k, l]) => {
      const times = a.availability.filter(x => x.day === k).map(x => x.time);
      return times.length ? `${l}: ${times.join(', ')}` : null;
    })
    .filter(Boolean).join('<br>') || '—';

  const assignedIds = appConfirmedClassIds(a);
  const assignedClasses = (assignState.agenda || []).filter(c => assignedIds.includes(String(c._id)));
  // Занятия из других дней/залов агенда не хранит — подтягиваем из общего кэша, если есть
  const knownClasses = window._allAssignedClassesCache && window._allAssignedClassesCache[a._id]
    ? window._allAssignedClassesCache[a._id]
    : assignedClasses;

  let comparisonBlock = '';
  if (assignedIds.length) {
    const rows = knownClasses.map(cls => `
      <p class="app-summary-line">${appDayLabel(cls.day)} ${cls.time} — ${cls.direction} (${cls.group || 'без группы'}), тренер: ${cls.trainerName}</p>
    `).join('');
    comparisonBlock = `
      <hr style="border:none;border-top:1px solid var(--border-soft);margin:10px 0">
      <p class="app-summary-line" style="color:var(--text-primary)">Оформлено администратором (сверьте перед отправкой):</p>
      ${rows || '<p class="app-summary-line">Загрузка…</p>'}
    `;
  }

  let actions = `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">`;
  actions += `<button class="wizard-opt" onclick="assignGoToDay()">📅 Создать запись</button>`;
  if (assignedIds.length) {
    actions += `<button class="wizard-opt" onclick="assignGoToDay()">➕ Добавить занятие</button>`;
  }
  if (a.status !== 'confirmed' && a.status !== 'no_slots') {
    actions += `<button class="wizard-opt" onclick="sendNoSlotsFeedback()">🚫 Нет свободных часов</button>`;
  }
  actions += `</div>`;

  if (assignedIds.length && a.status !== 'confirmed') {
    actions += `<button class="primary-btn" style="width:100%;margin-top:8px" onclick="sendApplicationConfirmation()">✅ Подтвердить занятие(-я) и отправить участнику</button>`;
  } else if (a.status === 'confirmed') {
    actions += `<p class="app-summary-line" style="color:var(--accent-pink);margin-top:8px">✅ Участнику уже отправлено подтверждение</p>`;
  } else if (a.status === 'no_slots') {
    actions += `<p class="app-summary-line" style="color:var(--accent-pink);margin-top:8px">🚫 Участнику отправлено: нет свободных часов</p>`;
  }
  actions += `<button class="wizard-opt" style="margin-top:8px" onclick="deleteApplication()">🗑 Удалить заявку</button>`;

  return `
    <button class="wizard-back" onclick="closeAssign()">← ко всем заявкам</button>
    <div class="status-card">
      <div class="title">${a.name} (${a.username ? '@' + a.username : a.phone})</div>
      <p class="app-summary-line">Направление: ${a.direction}, группа: ${a.group}</p>
      <p class="app-summary-line">Тренер в заявке: ${a.trainerName || 'не выбран'}</p>
      <p class="app-summary-line" style="margin-top:6px">Удобное время:<br>${availabilityText}</p>
      ${comparisonBlock}
      ${actions}
    </div>
  `;
}

async function refreshCurrentApplication() {
  assignState.application = await fetch(
    `/api/admin/applications/${assignState.application._id}?initData=${encodeURIComponent(initData)}`
  ).then(r => r.json());
  await loadAssignedClassesCache();
}

// Подтягиваем все занятия, назначенные текущей заявке (может быть несколько, в разных
// днях/залах) — используется в карточке "Оформлено администратором" для сверки
async function loadAssignedClassesCache() {
  const a = assignState.application;
  const ids = appConfirmedClassIds(a);
  window._allAssignedClassesCache = window._allAssignedClassesCache || {};
  if (!ids.length) {
    window._allAssignedClassesCache[a._id] = [];
    return;
  }
  window._allAssignedClassesCache[a._id] = await fetch(
    `/api/admin/classes/by-ids?initData=${encodeURIComponent(initData)}&ids=${ids.join(',')}`
  ).then(r => r.json());
}

async function sendApplicationConfirmation() {
  const res = await fetch(`/api/admin/applications/${assignState.application._id}/send-confirmation`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ initData }),
  });
  const data = await res.json();
  if (data.ok) {
    tg.HapticFeedback.notificationOccurred('success');
    tg.showAlert('Отправлено участнику!');
    await refreshCurrentApplication();
    renderAssignPanel();
  } else {
    tg.showAlert('Не получилось отправить.');
  }
}

function sendNoSlotsFeedback() {
  tg.showConfirm('Отправить участнику сообщение о том, что свободных часов нет?', async (ok) => {
    if (!ok) return;
    const res = await fetch(`/api/admin/applications/${assignState.application._id}/no-slots`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ initData }),
    });
    const data = await res.json();
    if (data.ok) {
      tg.HapticFeedback.notificationOccurred('success');
      tg.showAlert('Отправлено участнику.');
      await refreshCurrentApplication();
      renderAssignPanel();
    } else {
      tg.showAlert('Не получилось отправить.');
    }
  });
}

function deleteApplication() {
  tg.showConfirm('Удалить эту заявку? Действие необратимо.', async (ok) => {
    if (!ok) return;
    await fetch(`/api/admin/applications/${assignState.application._id}?initData=${encodeURIComponent(initData)}`, { method: 'DELETE' });
    tg.HapticFeedback.notificationOccurred('success');
    closeAssign();
  });
}

async function loadApplications() {
  const apps = await fetch('/api/admin/applications?initData=' + encodeURIComponent(initData)).then(r => r.json());
  window._applications = apps;
  renderApplicationsList();
}

function renderApplicationsList() {
  const apps = window._applications || [];
  const el = document.getElementById('applicationsList');
  el.innerHTML = apps.length
    ? apps.map(a => `
        <div class="class-item" style="cursor:pointer" onclick="openAssign('${a._id}')">
          <div class="info">
            <div class="day-time">${a.name} — ${a.direction} (${a.group})</div>
            <div class="type">Тренер: ${a.trainerName || 'не выбран'} · ${a.username ? '@' + a.username : a.phone}</div>
          </div>
        </div>
      `).join('')
    : '<div class="empty" style="margin-top:0">Новых заявок нет</div>';
}

// Пока открыта конкретная заявка — список остальных заявок скрыт, чтобы не мешал (был баг)
async function openAssign(appId) {
  const application = (window._applications || []).find(a => a._id === appId);
  if (!application) return;
  document.getElementById('applicationsList').style.display = 'none';
  assignState = {
    application, phase: 'info', day: null, room: null, agenda: [],
    editingClassId: null, editingField: null, newSlotTime: null, newSlotDraft: {},
  };
  await loadAssignedClassesCache();
  renderAssignPanel();
}

function closeAssign() {
  assignState = null;
  document.getElementById('assignPanel').innerHTML = '';
  document.getElementById('applicationsList').style.display = '';
  loadApplications();
}

function renderAssignPanel() {
  const panel = document.getElementById('assignPanel');
  const a = assignState.application;
  let html = appInfoCard(a);

  if (assignState.phase === 'day') {
    html += '<button class="wizard-back" onclick="assignBackToInfo()">← назад</button>';
    html += '<div class="wizard-step-label">Выберите день</div><div class="wizard-options">' +
      APP_WEEKDAYS.map(([k, l]) => `<button class="wizard-opt" onclick="assignGoToRoom('${k}')">${l}</button>`).join('') +
      '</div>';
  } else if (assignState.phase === 'room') {
    html += '<button class="wizard-back" onclick="assignGoToDay()">← назад</button>';
    html += `<div class="wizard-step-label">${appDayLabel(assignState.day)} — выберите зал</div><div class="wizard-options">` +
      [1, 2].map(r => `<button class="wizard-opt" onclick="assignGoToAgenda(${r})">Зал ${r}</button>`).join('') +
      '</div>';
  } else if (assignState.phase === 'agenda') {
    html += `<button class="wizard-back" onclick="assignGoToRoom('${assignState.day}')">← назад</button>`;
    html += `<div class="wizard-step-label">${appDayLabel(assignState.day)}, зал ${assignState.room}</div>`;
    html += renderAgendaRows();
  }
  panel.innerHTML = html;
}

function assignGoToDay() { assignState.phase = 'day'; renderAssignPanel(); }
function assignBackToInfo() { assignState.phase = 'info'; renderAssignPanel(); }
function assignGoToRoom(day) { assignState.day = day; assignState.phase = 'room'; renderAssignPanel(); }

async function assignGoToAgenda(room) {
  assignState.room = room;
  assignState.phase = 'agenda';
  assignState.editingClassId = null;
  assignState.newSlotTime = null;
  await loadAgenda();
}

async function loadAgenda() {
  if (!trainersCache.length) trainersCache = await fetch('/api/trainers').then(r => r.json());
  assignState.agenda = await fetch(
    `/api/admin/agenda?initData=${encodeURIComponent(initData)}&day=${assignState.day}&room=${assignState.room}`
  ).then(r => r.json());
  renderAssignPanel();
}

function renderAgendaRows() {
  return APP_HOURS.map(h => {
    const cls = assignState.agenda.find(c => c.time === h);
    if (!cls) {
      return assignState.newSlotTime === h
        ? renderNewSlotRow(h)
        : `<div class="agenda-row"><span class="agenda-time">${h}</span><button class="wizard-opt" onclick="assignStartNewSlot('${h}')">+ Добавить запись</button></div>`;
    }
    return renderClassRow(cls, h);
  }).join('');
}

function renderClassRow(cls, h) {
  let row = `<div class="agenda-row"><span class="agenda-time">${h}</span>`;
  row += `<button class="wizard-opt" onclick="assignEditField('${cls._id}','group')">${cls.group || 'Группа?'}</button>`;
  row += `<button class="wizard-opt" onclick="assignEditField('${cls._id}','direction')">${cls.direction}</button>`;
  row += `<button class="wizard-opt" onclick="assignEditField('${cls._id}','trainer')">${cls.trainerName}</button>`;
  row += `<button class="wizard-opt" onclick="assignEditField('${cls._id}','participants')">Участники (${cls.participants.length})</button>`;
  row += `<button class="wizard-opt" onclick="assignDeleteClass('${cls._id}')">🗑</button>`;
  row += '</div>';
  if (assignState.editingClassId === cls._id && assignState.editingField) {
    row += renderInlineEditor(cls);
  }
  return row;
}

async function assignDeleteClass(classId) {
  tg.showConfirm('Удалить эту запись целиком? Все участники будут откреплены.', async (ok) => {
    if (!ok) return;
    await fetch(`/api/admin/classes/${classId}?initData=${encodeURIComponent(initData)}`, { method: 'DELETE' });
    tg.HapticFeedback.notificationOccurred('success');
    loadApplications();
    await loadAgenda();
  });
}

function renderInlineEditor(cls) {
  const a = assignState.application;
  if (assignState.editingField === 'group') {
    return '<div class="wizard-options" style="margin:6px 0 12px">' +
      APP_GROUPS.map(g => `<button class="wizard-opt" onclick="assignPatchClass('${cls._id}','group','${g}')">${g}</button>`).join('') + '</div>';
  }
  if (assignState.editingField === 'direction') {
    return '<div class="wizard-options" style="margin:6px 0 12px">' +
      directionsCache.map(d => `<button class="wizard-opt" onclick="assignPatchClass('${cls._id}','direction','${d.replace(/'/g, "\\'")}')">${d}</button>`).join('') + '</div>';
  }
  if (assignState.editingField === 'trainer') {
    return '<div class="wizard-options" style="margin:6px 0 12px">' +
      trainersCache.map(t => `<button class="wizard-opt" onclick="assignPatchClass('${cls._id}','trainerId',${t.telegramId})">${t.name}</button>`).join('') + '</div>';
  }
  if (assignState.editingField === 'participants') {
    const already = cls.participants.some(p => p.chatId === a.chatId);
    let html = '<div style="margin:6px 0 12px">';
    cls.participants.forEach(p => {
      html += `<div class="app-summary-line">${p.name}${p.group ? ' — ' + p.group : ''} <button class="wizard-opt" style="padding:2px 8px;margin-left:6px" onclick="assignRemoveParticipant('${cls._id}',${p.chatId})">×</button></div>`;
    });
    if (!already) {
      html += `<button class="wizard-opt" style="margin-top:6px" onclick="assignAddApplicant('${cls._id}')">+ Добавить ${a.name} (эта заявка)</button>`;
    }
    html += '</div>';
    return html;
  }
  return '';
}

function assignEditField(classId, field) {
  if (assignState.editingClassId === classId && assignState.editingField === field) {
    assignState.editingClassId = null;
    assignState.editingField = null;
  } else {
    assignState.editingClassId = classId;
    assignState.editingField = field;
  }
  renderAssignPanel();
}

async function assignPatchClass(classId, field, value) {
  await fetch(`/api/admin/classes/${classId}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ initData, [field]: value }),
  });
  assignState.editingClassId = null;
  assignState.editingField = null;
  await loadAgenda();
}

async function assignAddApplicant(classId) {
  await fetch(`/api/admin/classes/${classId}/participants`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ initData, applicationId: assignState.application._id }),
  });
  tg.HapticFeedback.notificationOccurred('success');
  loadApplications();
  await refreshCurrentApplication();
  await loadAgenda();
}

async function assignRemoveParticipant(classId, chatId) {
  await fetch(`/api/admin/classes/${classId}/participants/${chatId}?initData=${encodeURIComponent(initData)}`, { method: 'DELETE' });
  await loadAgenda();
}

function assignStartNewSlot(h) {
  assignState.newSlotTime = h;
  assignState.newSlotDraft = {};
  renderAssignPanel();
}
function assignCancelNewSlot() { assignState.newSlotTime = null; renderAssignPanel(); }
function assignNewSlotPick(field, value) { assignState.newSlotDraft[field] = value; renderAssignPanel(); }

function renderNewSlotRow(h) {
  const draft = assignState.newSlotDraft;
  let row = `<div class="agenda-row"><span class="agenda-time">${h}</span><button class="wizard-opt" onclick="assignCancelNewSlot()">отмена</button></div>`;
  if (!draft.group) {
    row += '<div class="wizard-options" style="margin:6px 0 12px">' +
      APP_GROUPS.map(g => `<button class="wizard-opt" onclick="assignNewSlotPick('group','${g}')">${g}</button>`).join('') + '</div>';
    return row;
  }
  if (!draft.direction) {
    row += '<div class="wizard-options" style="margin:6px 0 12px">' +
      directionsCache.map(d => `<button class="wizard-opt" onclick="assignNewSlotPick('direction','${d.replace(/'/g, "\\'")}')">${d}</button>`).join('') + '</div>';
    return row;
  }
  if (!draft.trainerId) {
    row += '<div class="wizard-options" style="margin:6px 0 12px">' +
      trainersCache.map(t => `<button class="wizard-opt" onclick="assignNewSlotPick('trainerId',${t.telegramId})">${t.name}</button>`).join('') + '</div>';
    return row;
  }
  row += `<button class="primary-btn" style="width:100%;margin:6px 0 12px" onclick="assignCreateNewSlot('${h}')">Создать и записать ${assignState.application.name}</button>`;
  return row;
}

async function assignCreateNewSlot(time) {
  const draft = assignState.newSlotDraft;
  const res = await fetch('/api/admin/classes', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      initData, day: assignState.day, time, room: assignState.room,
      direction: draft.direction, trainerId: draft.trainerId, group: draft.group,
      applicationId: assignState.application._id,
    }),
  });
  const data = await res.json();
  if (data.ok) {
    tg.HapticFeedback.notificationOccurred('success');
    tg.showAlert('Занятие создано, участник записан. Проверьте данные и нажмите «Подтвердить», чтобы уведомить его.');
    assignState.newSlotTime = null;
    loadApplications();
    await refreshCurrentApplication();
    await loadAgenda();
  } else {
    tg.showAlert(data.error === 'slot_taken' ? 'Этот слот уже занят.' : 'Не получилось создать занятие.');
  }
}

// ---------- Мастер добавления занятия ----------
const WEEKDAYS = [
  ['mon', 'Понедельник'], ['tue', 'Вторник'], ['wed', 'Среда'],
  ['thu', 'Четверг'], ['fri', 'Пятница'], ['sat', 'Суббота'], ['sun', 'Воскресенье'],
];
const WORK_HOURS = [];
for (let h = 9; h <= 20; h++) WORK_HOURS.push(String(h).padStart(2, '0') + ':00');

function dayLabel(key) {
  const found = WEEKDAYS.find(([k]) => k === key);
  return found ? found[1] : key;
}

let wizardState = {};

function startClassWizard() {
  wizardState = { day: null, time: null, room: null, direction: null, trainerId: null };
  renderWizard();
}

function wizardBack() {
  if (wizardState.trainerId) wizardState.trainerId = null;
  else if (wizardState.direction) wizardState.direction = null;
  else if (wizardState.room) wizardState.room = null;
  else if (wizardState.time) wizardState.time = null;
  else if (wizardState.day) wizardState.day = null;
  renderWizard();
}

function backButtonHtml() {
  return wizardState.day ? '<button class="wizard-back" onclick="wizardBack()">← назад</button>' : '';
}

async function renderWizard() {
  const el = document.getElementById('classWizard');

  if (!wizardState.day) {
    el.innerHTML = '<div class="wizard-step-label">Выбери день недели</div><div class="wizard-options">' +
      WEEKDAYS.map(([k, l]) => `<button class="wizard-opt" onclick="pickDay('${k}')">${l}</button>`).join('') +
      '</div>';
    return;
  }

  if (!wizardState.time) {
    const classes = await fetch('/api/admin/classes?initData=' + encodeURIComponent(initData) + '&day=' + wizardState.day).then(r => r.json());
    const busyHours = new Set(classes.map(c => c.time));
    el.innerHTML = backButtonHtml() +
      `<div class="wizard-step-label">${dayLabel(wizardState.day)} — выбери время</div><div class="wizard-options">` +
      WORK_HOURS.map(h => `<button class="wizard-opt" ${busyHours.has(h) ? 'disabled' : ''} onclick="pickTime('${h}')">${h}${busyHours.has(h) ? ' (занято)' : ''}</button>`).join('') +
      '</div>';
    return;
  }

  if (!wizardState.room) {
    const classes = await fetch('/api/admin/classes?initData=' + encodeURIComponent(initData) + '&day=' + wizardState.day).then(r => r.json());
    const busyRooms = new Set(classes.filter(c => c.time === wizardState.time).map(c => c.room));
    el.innerHTML = backButtonHtml() +
      `<div class="wizard-step-label">${dayLabel(wizardState.day)}, ${wizardState.time} — выбери зал</div><div class="wizard-options">` +
      [1, 2].map(r => `<button class="wizard-opt" ${busyRooms.has(r) ? 'disabled' : ''} onclick="pickRoom(${r})">Зал ${r}${busyRooms.has(r) ? ' (занят)' : ''}</button>`).join('') +
      '</div>';
    return;
  }

  if (!wizardState.direction) {
    const directions = await fetch('/api/directions').then(r => r.json());
    el.innerHTML = backButtonHtml() +
      `<div class="wizard-step-label">Зал ${wizardState.room} — направление</div><div class="wizard-options">` +
      directions.map(d => `<button class="wizard-opt" onclick="pickDirection('${d}')">${d}</button>`).join('') +
      '</div>';
    return;
  }

  if (!wizardState.trainerId) {
    const trainers = await fetch('/api/admin/trainers?initData=' + encodeURIComponent(initData)).then(r => r.json());
    el.innerHTML = backButtonHtml() +
      `<div class="wizard-step-label">${wizardState.direction} — кто ведёт?</div><div class="wizard-options">` +
      trainers.map(t => `<button class="wizard-opt" onclick="pickTrainer(${t.telegramId})">${t.name}</button>`).join('') +
      '</div>';
    return;
  }
}

function pickDay(k) { wizardState.day = k; renderWizard(); }
function pickTime(t) { wizardState.time = t; renderWizard(); }
function pickRoom(r) { wizardState.room = r; renderWizard(); }
function pickDirection(d) { wizardState.direction = d; renderWizard(); }

async function pickTrainer(id) {
  wizardState.trainerId = id;
  const res = await fetch('/api/admin/classes', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ initData, ...wizardState })
  });
  const data = await res.json();
  if (data.ok) {
    tg.HapticFeedback.notificationOccurred('success');
    tg.showAlert('Занятие создано!');
    startClassWizard();
  } else {
    tg.showAlert(data.error === 'slot_taken' ? 'Этот зал уже занят на это время.' : 'Не получилось сохранить.');
    wizardState.trainerId = null;
    renderWizard();
  }
}

// ---------- Интерактивный календарь ----------
const MONTH_NAMES = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
let calDate = new Date();
let calSelectedDate = null;

function initCalendar() {
  calDate = new Date();
  calSelectedDate = null;
  document.getElementById('calAgenda').innerHTML = '';
  renderCalendarMonth();
}

function renderCalendarMonth() {
  document.getElementById('calMonthLabel').textContent = MONTH_NAMES[calDate.getMonth()] + ' ' + calDate.getFullYear();
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';

  const year = calDate.getFullYear();
  const month = calDate.getMonth();
  const firstDay = new Date(year, month, 1);
  const startOffset = (firstDay.getDay() + 6) % 7; // 0 = понедельник
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const daysInPrevMonth = new Date(year, month, 0).getDate();
  const todayStr = new Date().toISOString().slice(0, 10);

  for (let i = 0; i < startOffset; i++) {
    const cell = document.createElement('div');
    cell.className = 'cal-cell other-month';
    cell.textContent = daysInPrevMonth - startOffset + i + 1;
    grid.appendChild(cell);
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const cell = document.createElement('div');
    cell.className = 'cal-cell';
    if (dateStr === todayStr) cell.classList.add('today');
    if (dateStr === calSelectedDate) cell.classList.add('selected');
    cell.textContent = d;
    cell.onclick = () => selectCalendarDate(dateStr, cell);
    grid.appendChild(cell);
  }

  const totalCells = startOffset + daysInMonth;
  const trailing = (7 - (totalCells % 7)) % 7;
  for (let i = 1; i <= trailing; i++) {
    const cell = document.createElement('div');
    cell.className = 'cal-cell other-month';
    cell.textContent = i;
    grid.appendChild(cell);
  }
}

function calPrevMonth() { calDate.setMonth(calDate.getMonth() - 1); renderCalendarMonth(); }
function calNextMonth() { calDate.setMonth(calDate.getMonth() + 1); renderCalendarMonth(); }

async function selectCalendarDate(dateStr, cellEl) {
  calSelectedDate = dateStr;
  document.querySelectorAll('.cal-cell').forEach(c => c.classList.remove('selected'));
  cellEl.classList.add('selected');

  const agenda = document.getElementById('calAgenda');
  agenda.innerHTML = '<div class="empty" style="margin-top:12px">Загрузка...</div>';

  const data = await fetch('/api/admin/calendar?initData=' + encodeURIComponent(initData) + '&date=' + dateStr).then(r => r.json());
  if (!data.classes || !data.classes.length) {
    agenda.innerHTML = '<div class="empty" style="margin-top:12px">На этот день занятий нет</div>';
    return;
  }
  agenda.innerHTML = data.classes.map(c => `
    <div class="cal-agenda-item">
      <div style="font-weight:500">${c.time} — зал ${c.room} — ${c.direction}</div>
      <div style="color:var(--text-secondary); margin-top:2px">Тренер: ${c.trainerName}</div>
      <div style="color:var(--text-secondary); margin-top:4px">${c.participants.length ? c.participants.map(p => '@' + p.username).join(', ') : 'пока никто не записан'}</div>
    </div>
  `).join('');
}

// Свайп влево/вправо по сетке календаря — смена месяца
let calTouchStartX = null;
document.getElementById('calGrid').addEventListener('touchstart', e => {
  calTouchStartX = e.touches[0].clientX;
});
document.getElementById('calGrid').addEventListener('touchend', e => {
  if (calTouchStartX === null) return;
  const dx = e.changedTouches[0].clientX - calTouchStartX;
  if (Math.abs(dx) > 40) {
    if (dx < 0) calNextMonth(); else calPrevMonth();
  }
  calTouchStartX = null;
});

initApp();
</script>
